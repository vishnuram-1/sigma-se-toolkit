name: Daily Gong Call Sync

on:
  schedule:
    # 5 AM EST (10 AM UTC) every day
    - cron: "0 10 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print actions without writing files or committing"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit and push prospect files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest (avoid push conflicts)
        run: git pull --rebase origin main

      - name: Run sync
        env:
          SIGMA_BASE_URL: ${{ secrets.SIGMA_BASE_URL }}
          SIGMA_CLIENT_ID: ${{ secrets.SIGMA_CLIENT_ID }}
          SIGMA_CLIENT_SECRET: ${{ secrets.SIGMA_CLIENT_SECRET }}
        run: python scripts/sync_gong_calls.py ${{ inputs.dry_run && '--dry-run' || '' }}
